name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version with commit hash
        run: |
          STAMP=$(date +%Y%m%d%H%M)-${GITHUB_SHA::7}
          echo "{\"version\":\"$STAMP\"}" > version.json
          sed -i "s/APP_VERSION = '[^']*'/APP_VERSION = '$STAMP'/" js/app.js
          # Estampille toutes les ressources versionnées (CSS, app.js, vendor)
          sed -i "s/?v=[A-Za-z0-9._-]*/?v=$STAMP/g" index.html
          sed -i "s/CACHE_NAME = '[^']*'/CACHE_NAME = 'followdia-$STAMP'/" sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
